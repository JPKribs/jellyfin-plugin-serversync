name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v12.2.7.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get Release Info
        id: release_info
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # The tag is the single source of truth. A manual dispatch must name one explicitly, so a
          # run without a tag can never hash a 404 page into the manifest every user's server fetches.
          TAG="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            echo "No release tag available; refusing to touch the manifest." >&2
            exit 1
          fi

          # The version comes from the tag itself, not from build.yaml at the checked out commit, so a
          # manual publish from master cannot pick up a version a later auto-increment wrote into build.yaml.
          BUILD_VERSION="${TAG#v}"

          # Read targetAbi from build.yaml as it was at the tag, falling back to the checked out copy.
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          TARGET_ABI=$(git show "refs/tags/${TAG}:build.yaml" 2>/dev/null | sed -n 's/^targetAbi:[[:space:]]*//p' | tr -d '"' || true)
          if [ -z "$TARGET_ABI" ]; then
            TARGET_ABI=$(sed -n 's/^targetAbi:[[:space:]]*//p' build.yaml | tr -d '"')
          fi

          BASE_URL="https://github.com/JPKribs/jellyfin-plugin-serversync/releases/download/${TAG}"
          ASSET="jellyfin-plugin-serversync-${BUILD_VERSION}.zip"

          # -f on every download: a missing asset must fail the job rather than hashing an error page.
          echo "Trying to download checksum from: ${BASE_URL}/${ASSET}.md5"
          CHECKSUM=$(curl -sfL "${BASE_URL}/${ASSET}.md5" | cut -d' ' -f1 || true)
          if [ -z "$CHECKSUM" ]; then
            echo "Checksum download failed, calculating from ZIP file..."
            curl -sfL -o temp_plugin.zip "${BASE_URL}/${ASSET}"
            CHECKSUM=$(md5sum temp_plugin.zip | cut -d' ' -f1)
            rm temp_plugin.zip
          fi

          if ! echo "$CHECKSUM" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "Checksum '${CHECKSUM}' does not look like an MD5 hash; aborting." >&2
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Tag: ${TAG}"
          echo "Build Version: ${BUILD_VERSION}"
          echo "Target ABI: ${TARGET_ABI}"
          echo "Checksum: ${CHECKSUM}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "target_abi=${TARGET_ABI}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Build Manifest Entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          BUILD_VERSION: ${{ steps.release_info.outputs.build_version }}
          TARGET_ABI: ${{ steps.release_info.outputs.target_abi }}
          CHECKSUM: ${{ steps.release_info.outputs.checksum }}
          TIMESTAMP: ${{ steps.release_info.outputs.timestamp }}
        run: |
          set -euo pipefail

          # The release body reaches the shell only through gh and env vars, never through workflow
          # template interpolation, so quotes or $() in a changelog cannot execute or break the job.
          RELEASE_BODY=$(gh release view "$TAG" --json body --jq '.body // ""')
          SANITIZED_CHANGELOG=$(printf '%s' "$RELEASE_BODY" | tr -d '`')

          # Only the new version entry is built here. It is inserted into
          # whatever manifest.json is on master at push time (next step) —
          # editing the tag-commit's copy and pushing it wholesale could
          # clobber entries added to master after the tag was cut.
          jq -n \
            --arg version "$BUILD_VERSION" \
            --arg changelog "$SANITIZED_CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
            --arg sourceUrl "https://github.com/JPKribs/jellyfin-plugin-serversync/releases/download/${TAG}/jellyfin-plugin-serversync-${BUILD_VERSION}.zip" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            '{
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            }' > /tmp/new-version.json

      - name: Commit Changes
        env:
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # The checkout is the release tag's commit (detached HEAD), and
          # master may have moved past it — a blind push of a commit based on
          # the tag gets rejected, which is exactly how v10.11.66.1 failed to
          # publish. Instead: fetch CURRENT master, insert the new entry into
          # master's manifest, push, and retry if master moves mid-publish.
          # The select() drops any existing entry with the same version, so a
          # re-run of a failed publish is idempotent.
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -f -B master FETCH_HEAD
            jq --argjson newVersion "$(cat /tmp/new-version.json)" \
              '.[0].versions = [$newVersion] + [ .[0].versions[] | select(.version != $newVersion.version) ]' \
              manifest.json > manifest_temp.json
            mv manifest_temp.json manifest.json
            git add manifest.json
            if git diff --cached --quiet; then
              echo "Manifest already up to date on master; nothing to push"
              exit 0
            fi
            git commit -m "Update manifest for release ${TAG}"
            if git push origin master; then
              exit 0
            fi
            echo "Push rejected (master moved during publish); retrying (${attempt}/3)"
            sleep 5
          done
          echo "Failed to push the manifest update after 3 attempts"
          exit 1
