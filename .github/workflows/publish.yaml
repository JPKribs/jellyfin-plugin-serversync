name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get Release Info
        id: release_info
        run: |
          # Extract version and targetAbi from build.yaml
          BUILD_VERSION=$(grep '^version:' build.yaml | sed 's/version: *"\?\([^"]*\)"\?.*/\1/' | tr -d '"')
          TARGET_ABI=$(grep '^targetAbi:' build.yaml | sed 's/targetAbi: *"\?\([^"]*\)"\?.*/\1/' | tr -d '"')

          # Try to download the checksum file from the release assets
          ASSET_URL="https://github.com/JPKribs/jellyfin-plugin-serversync/releases/download/${{ github.event.release.tag_name }}/jellyfin-plugin-serversync-${BUILD_VERSION}.zip.md5"
          echo "Trying to download checksum from: ${ASSET_URL}"

          CHECKSUM=$(curl -s "${ASSET_URL}")

          # If curl failed or returned empty, calculate checksum ourselves
          if [ -z "$CHECKSUM" ]; then
            echo "Checksum download failed, calculating from ZIP file..."
            ZIP_URL="https://github.com/JPKribs/jellyfin-plugin-serversync/releases/download/${{ github.event.release.tag_name }}/jellyfin-plugin-serversync-${BUILD_VERSION}.zip"
            curl -L -o temp_plugin.zip "${ZIP_URL}"
            CHECKSUM=$(md5sum temp_plugin.zip | cut -d' ' -f1)
            rm temp_plugin.zip
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Build Version: ${BUILD_VERSION}"
          echo "Target ABI: ${TARGET_ABI}"
          echo "Checksum: ${CHECKSUM}"

          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "target_abi=${TARGET_ABI}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Build Manifest Entry
        run: |
          # Sanitize changelog by removing backticks
          SANITIZED_CHANGELOG=$(echo "${{ github.event.release.body }}" | tr -d '\`')

          # Only the new version entry is built here. It is inserted into
          # whatever manifest.json is on master at push time (next step) —
          # editing the tag-commit's copy and pushing it wholesale could
          # clobber entries added to master after the tag was cut.
          jq -n \
            --arg version "${{ steps.release_info.outputs.build_version }}" \
            --arg changelog "$SANITIZED_CHANGELOG" \
            --arg targetAbi "${{ steps.release_info.outputs.target_abi }}" \
            --arg sourceUrl "https://github.com/JPKribs/jellyfin-plugin-serversync/releases/download/${{ github.event.release.tag_name }}/jellyfin-plugin-serversync-${{ steps.release_info.outputs.build_version }}.zip" \
            --arg checksum "${{ steps.release_info.outputs.checksum }}" \
            --arg timestamp "${{ steps.release_info.outputs.timestamp }}" \
            '{
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            }' > /tmp/new-version.json

      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # The checkout is the release tag's commit (detached HEAD), and
          # master may have moved past it — a blind push of a commit based on
          # the tag gets rejected, which is exactly how v10.11.66.1 failed to
          # publish. Instead: fetch CURRENT master, insert the new entry into
          # master's manifest, push, and retry if master moves mid-publish.
          # The select() drops any existing entry with the same version, so a
          # re-run of a failed publish is idempotent.
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -f -B master FETCH_HEAD
            jq --argjson newVersion "$(cat /tmp/new-version.json)" \
              '.[0].versions = [$newVersion] + [ .[0].versions[] | select(.version != $newVersion.version) ]' \
              manifest.json > manifest_temp.json
            mv manifest_temp.json manifest.json
            git add manifest.json
            if git diff --cached --quiet; then
              echo "Manifest already up to date on master; nothing to push"
              exit 0
            fi
            git commit -m "Update manifest for release ${{ github.event.release.tag_name }}"
            if git push origin master; then
              exit 0
            fi
            echo "Push rejected (master moved during publish); retrying (${attempt}/3)"
            sleep 5
          done
          echo "Failed to push the manifest update after 3 attempts"
          exit 1
