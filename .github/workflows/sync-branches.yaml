name: '🔀 Sync Branches'

# master holds releases and patch fixes. unstable holds feature work until it is tested.
#
# sync     Runs on every push to master. Merges master into unstable, so unstable always has every
#          patch and manifest update. A merge that conflicts opens a pull request from
#          sync/master-into-unstable instead, to resolve by hand.
# promote  Started by hand from the Actions tab for a feature release. Fast-forwards master to unstable,
#          then starts the release draft, build, and test runs on master.
#
# A push made with the workflow's own token starts no other workflow, so both jobs start the runs a push
# would have started themselves.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      action:
        description: 'sync merges master into unstable. promote moves master to unstable for a feature release.'
        type: choice
        options:
          - sync
          - promote
        default: sync

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'push' || inputs.action == 'sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: unstable
          fetch-depth: 0

      - name: Merge master into unstable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "unstable already has every commit on master."
            exit 0
          fi
          if git merge --no-ff --no-edit -m "Merge master into unstable" origin/master; then
            git push origin HEAD:unstable
            gh workflow run test.yaml --ref unstable || true
            exit 0
          fi
          git merge --abort
          BRANCH=sync/master-into-unstable
          git push --force origin origin/master:refs/heads/${BRANCH}
          if [ -z "$(gh pr list --head "${BRANCH}" --base unstable --state open --json number --jq '.[].number')" ]; then
            gh pr create --base unstable --head "${BRANCH}" \
              --title "Merge master into unstable" \
              --body "master and unstable conflict. Resolve the conflicts in this pull request and merge it. Delete the branch once it is merged."
          fi
          echo "::warning::master and unstable conflict. A pull request from ${BRANCH} holds the merge."

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Move master to unstable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master unstable
          if ! git merge-base --is-ancestor origin/master origin/unstable; then
            echo "::error::unstable is missing commits from master. Run this workflow with sync first, and merge its pull request if it opens one."
            exit 1
          fi
          if [ "$(git rev-parse origin/master)" = "$(git rev-parse origin/unstable)" ]; then
            echo "master is already at unstable."
            exit 0
          fi
          git push origin origin/unstable:refs/heads/master
          for WORKFLOW in changelog.yaml build.yaml test.yaml; do
            gh workflow run "${WORKFLOW}" --ref master || true
          done
          echo "master is at $(git rev-parse --short origin/unstable)."
