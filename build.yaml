changelog:
  features:
  - Link cache. A link can keep a full local copy of its file in a cache while staying a link. Playing a link caches it, episodes ahead of the one being watched are cached before they are reached, and each library can pick shows and films to always keep. A cached link plays from this server under its own rules, even while its source is down, and playback is still reported to the source. Set the cache's size, location, retention, pre-cache episodes, and removal order under Content in Settings. The cache is off until it is given a size
  - A link takes its media info, chapters, chapter images, and trickplay images from the source instead of probing the file across the network, and a link's trickplay shows in its details
  - Every Sync Content run checks links against the servers they stream from. A link that can no longer play shows on the Sync tab with the reason, and settles again when it can
  - A link stream that drops or stalls partway is picked up where it stopped, from the same server or another that holds the file, so the player does not see the break
  - A Link mapping links every version of a film, not only the first, and each is checked on its own at play. A user refused one, such as a file above their bitrate limit, is offered the versions they may play. Copy mappings still copy the first version only
  - Direct play of a link is streamed for the user who asked, so two viewers of one link are counted and limited apart
  - A source can cap the speed of each link stream and cache download per server, with another speed during the bandwidth schedule's hours, and cap streams and speed per user on each user mapping
  changed:
  - A server that did not answer is passed over for a minute while another holds the file, and the others are asked together, so a dead source no longer costs every play its timeout
  - The media probe of a new link may read at most 256 MB of the file
  fixed:
  - An .nfo beside a link that the user deleted was written again on the next sync
  developer:
  - New peer routes on the source, Links/Describe and Links/{itemId}/Images, and a fill flag on Stream for cache downloads. Older sources answer 404 to the new routes, and the linking server then probes its links and does not check them
