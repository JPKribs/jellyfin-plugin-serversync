overview: "Keep several Jellyfin servers in step: content, metadata, people, users, playlists, and watch history."
description: >
  Server Sync keeps a pool of Jellyfin servers in step. Each server scans the others it is told to in
  priority order and pulls missing or updated content, metadata, people, user settings, playlists, and
  watch history. Servers that both run the plugin also tell each other about changes as they happen, so an
  edit or a play made on one shows up on the others within seconds, and the scheduled scan remains
  the safety net. Watch history merges three way against what the servers last agreed on, and other
  values resolve on where and when they were last edited, so the newest edit always wins.
