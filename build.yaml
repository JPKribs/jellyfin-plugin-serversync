changelog:
  changed:
  - The third step of a server entry is named Linking, the metadata option for who appears in an item is named People, and a synced copy on the Sync tab reads Synced
  - Descriptions and messages across the pages are shorter and end with a period, and the hint above the server list says how rank works
  - The reasons a link stream is refused name the count plainly, as in 1 stream or 2 link streams
  - The scheduled steps that Sync Content and Sync Information run are named for what they do in the log and on the Activity page, such as Scan Content and Copy Content
  - The pages are drawn with the new Base components. Buttons, numbered steps, count cards, and status messages look a little different, a status message carries an icon, and a file size reads 2 KB where it read 2.00 KB
  - A thumbnail in the Content and History tables is always upright, so an episode still is cropped to fit
  - Addresses in 100.64.0.0/10, the range Tailscale uses, count as a private network. A server entry at such an address needs Allow Private Network Address on, which it is by default
  fixed:
  - A viewer who stopped a link stayed on the source's dashboard as still playing, and pressing Stop there answered that the session was not found. The session now goes idle when playback stops and leaves the dashboard 20 minutes later
  - Saving a server entry with an empty Server URL was accepted and dropped its stored API Key. The save is refused and the key is kept
  - A user that had never synced showed a last sync of 739934 days ago. It reads Never
  - A deep page of a large Sync tab table took about a second to load. It sorts the page before reading its rows
  - A watch history refresh looked up the same user for every item. A refresh that took 40.5 seconds takes 17.2 on the same data
  - The refusal to save a server whose Server Sync cannot talk to this one showed as a pop up. It shows beside the Save button
  - A settings file with an empty server entry stopped the settings from loading
  - A server entry asked for with its key in another letter case was sent no pairing secret. The secret is read under the key the entry was saved with
  - A thumbnail from a server entry that could not be called failed with an error. It shows as no image
  - An image's size could read 1,5 KB on a server set to a language that writes decimals with a comma
  - The History detail on a phone ran off the side of the screen
  developer:
  - The guides in starthere.md and skills cover naming, style, code, testing, profiling, documentation, review, and release, and docs/Architecture.md maps the parts
  - Tests mirror the source folders, shared fakes live in Fakes, and the tests that measure real time or disk space run in one serial collection
  - Every source file that holds logic has a test file of its own, the controllers included, and each route is checked for the authorization or peer guard it must carry. The suite grows from 1,264 tests to 4,177
  - Every namespace matches its folder and every type has a file named after it
  - Comments follow the code guide. A catch names the exceptions it expects or filters out a cancelled run, and each one left broad says why
  - The image proxy asks the source through SourceServerClientFactory, as every other call does
  - A history fetch no longer asks the source for media sources, which it never read
  - Values another server or a request supplies pass through SanitizeForLog in the link, provider, and whitelist log lines
  - PluginConfiguration.ValidateConfiguration and IsValid, which nothing called, are removed
  - Uses JPKribs.Jellyfin.Base 2026.11.16. Its speed bucket, throttled and capped streams, retry handler, path containment, hashing, size constants, and address rules replace the local copies
  - The pages use Base's base- classes and tokens, and each is built with createConfigPage through createServerSyncPage in serversync_shared.js, which also holds the tab list
  - Table thumbnails come from a column image loader that reads the image proxy, which replaces the three local thumbnail builders
