changelog:
  added:
  - Failed items of every sync type are tried again on the next run, without anyone pressing Retry. An item that has failed on every run for a day is raised once on Jellyfin's Activity page as Server Sync Needs Attention, with how many items of each kind and one reason, and goes on being retried
  - A run that has ended the same wrong way for a day, such as a cleanup held by a safety limit, a server that cannot be reached, or a disk too full to download to, is raised once on the Activity page. A clean run clears it
  - Each copy records the server it first came from. Between servers that sync with each other, a file removed on the server it came from is not downloaded back from another server's copy, and copies on other servers stop keeping each other in place once it is removed. A Link library works the other way round and links to any server that holds the file
  - A media file leaving a library is announced to the servers that library is shared with. A link to it moves to another server that holds the file, or is removed when none does, without waiting for a scan
  - Each server keeps a 30 day record of the files that left its library, and a scan that lists only what changed asks for it, so a removal is settled on the next scan rather than the next full scan
  - Plays are spread over the servers that hold a film. The link's own server streams it while idle, then the first idle server down the list, then the one with the most streams free
  - Link stream limits of this server's own under Settings > Content > Links, for all servers together and for each server it links to. A server at its limit is passed over for the next that holds the film
  - Copies tracked before this release are marked once after the update, each as this server's own file or as a download from the server it came from, so the rules for origins and own files cover existing libraries
  - Two servers that sync with each other and already hold a title as different files each keep their own. The row is settled and says the two differ, and queueing it by hand takes the other server's file. A Pull server is still mirrored, by Changed files
  - In a Link library a film the server already has is never downloaded over, whether the other server's file at that name is the same, different, or changes later. Picking it to Always Keep asks for the other server's copy
  - A file that was on a server before it was matched to another server's is that server's own. It stays when the other server removes its file, whatever Removed files is set to, and shows as Already Here among the copies on the Storage tab
  - Cache Size is a choice of Off, all available space, a fixed amount, or a percentage of available space. A cache sized by its disk leaves Minimum Free Space free
  - Every Sync Content run starts by writing again any link that is missing, empty, or points at an address this server no longer answers on. It needs no source
  - The Servers map draws each server as its own pill in a lane that is always in the same place, with pulls on the left, pushes on the right, and syncs below, and one line per lane in the colour of that direction's badge
  changed:
  - Stream is removed as a direction. Every Stream entry becomes Push on the update, and that server is given the same files and links. Mapping libraries on the entry also tells it about changes in them as they happen
  - Saving a server as Push or Sync, or with a library kept as links, is refused when that server answers and does not run Server Sync. A plain Jellyfin server can be a Pull server whose libraries are copies. A server that cannot be reached is saved
  - A link whose file is replaced on the source by one of the same name in another container, as Film.mkv by Film.mp4, follows the new file on the next run, in place, once the source confirms the old file is gone
  - A copy replaced the same way has its old file handled by Removed files on that run instead of the next full scan
  - A server that does not answer, or whose library filter names a collection it no longer has, holds back the cleanup of its own files only. The other servers' removed files are cleaned up as usual
  - With Removed files on Keep, a row for an item the source no longer has, and that holds no file here, is dropped instead of failing to download on every run
  - Removing a server removes the links that streamed from it. Its copies stay
  - Failed Item Retries counts tries within one run
  - Every field that falls back when left empty shows Default, labels carry no colon, and each page takes its styles from one stylesheet
  fixed:
  - A partner server whose library answered with no items, as one that holds only links does, stopped every removal from every server whenever both servers gave their libraries the same id
  - A disabled or removed server's leftover rows could stop the cleanup for every other server sharing a library id with it
  - Changes paused for a server kept waiting out the pause after its entry was corrected. Editing the address, key, or direction of a paused server now sends them on the next pass
  - A download interrupted while replacing a file could leave the old file hidden under a temporary name with the film missing. The file, its subtitles, artwork, and nfo are put back on the next run
  - A re-encode of a linked file under the same name kept showing the old codec and playing the old cached file
  - Deleting a copy whose replacement of the same name in another container was already in place removed the images and trickplay the two share
  - Two source files that would land at one local path each refused for the other, so neither was ever synced. The one tracked first goes ahead
  - A queued row under a library mapping that is off errored on every run
  - With the disk below Minimum Free Space, files waiting to be removed were never removed, and a run with nothing to download skipped the link check and cache upkeep
  - A download from a source that sends no length could replace a good file with a short one
  - A link's .strm replaced by hand could be deleted when the link's row was removed
  - A link whose .strm went missing with Removed files on Delete had its row dropped and made again a day later instead of being written again
  - An empty .strm, as a power loss leaves it, was refused as a file Server Sync did not write
  - A change from a server that is no longer set up here was retried every hour for good
  - A half-copied download left in a library folder by a crash stayed until the same file was downloaded again
  - A damaged link cache index left its files unused and uncounted, and a cached file at the wrong size was never removed
  - A link being turned into a copy could stall for good on a disk too full for a second copy when the first had already arrived
  developer:
  - Database schema 36 adds OriginServerId to SyncItems, a SyncAttention table for when each failing row first failed, and a RemovedItems record of the files that left the library
  - GET /Sync/Peer/Copies lists the copies a server downloaded and their origins, and GET /Sync/Peer/Changes the files that left its library since a time. POST /Sync/Peer/Stream/Check answers with StreamsInUse and StreamLimit. GET /Sync/LinkCache reports Sizing
  - Five routes nothing called are removed. GET /Sync/UserItems, GET /Sync/UserItems/{id}, POST /Sync/UserItems/UpdateStatus, POST /Sync/UserItems/Ignore, and POST /Sync/PeopleItems/UpdateStatus
  - integration/matrix.py runs every file change across five pool shapes as copies and as links, and kills a server mid-download, mid-replacement, and for five runs, and moves a link between two servers that hold the same film
