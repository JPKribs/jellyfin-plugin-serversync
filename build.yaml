changelog:
  added:
  - Every page, message, and Activity page entry is shown in the viewer's language. Jellyfin's own words come in every language Jellyfin has, and the rest is in US English until it is translated
  changed:
  - Labels, buttons, headings, columns, badges, and Activity page names are in sentence case, as Jellyfin writes them, such as Send changes after (seconds) and 12 items synced
  - A message a page shows, such as a refused Server URL, is in the page's language, and an Activity page entry is in the server's display language
  - The tables, dialogs, charts, and lists drawn by Base show their own text in the viewer's language
  fixed:
  - The pool card on the Servers tab read "This Server, this server" when the server had no name. It reads This server
  - The Activity page entry for one failing item read "1 Item Keep Failing". It reads 1 item keeps failing
  developer:
  - Uses JPKribs.Jellyfin.Base 12.4.0, then 12.4.1. BaseTranslations.RequestLanguage replaces the local RequestLanguage helper, and ActivityOutcome takes keys for its names
  - Every string a person reads comes from Localization/en-us.json or a declared Jellyfin string, with Localization/casing.json for the words kept as written. GET /Sync/Translations answers with language, strings, and casing
  - The source is organized into Api, Configuration, Web, Assets, Models, Services, Tasks, and Utilities, and the Docker pool and matrix live in tools/integration
