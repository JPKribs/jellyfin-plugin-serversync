changelog:
  developer:
  - Fixed People sync finding zero source people on servers configured with a non-admin token (catalog is fetched via /Persons again)
  - Refreshes no longer prune tracking rows when the source answers with an empty catalog, and never remove more than half the table in a single run
  - Fixed a permanent verification loop when servers store the same premiere/end date with different times of day
  - Task progress now moves through fetch, build, and prune in proportion to the actual work instead of freezing near the end of large runs
