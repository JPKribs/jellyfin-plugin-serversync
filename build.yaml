changelog:
  features:
  - Link storage. A library mapping can hold its videos as links instead of copies. Each link is a small .strm file beside a .nfo, and plays by streaming the file from the source through this server, so nothing is downloaded. Both servers need this release, and only video is linked; audio and books in a Link mapping are still copied
  - The source decides who may stream. Turn on Allow Linking on its entry for the linking server, map users or pick a user for unmapped ones, and set Link Streams At Once and Link Streams Per User. A user's streams through every linking server count toward their per user limit, and the source can also count their own playback there and honor their remote bitrate limit
  - Playback of a link shows on the source as a session under the client name Server Sync, lands in its activity log, and updates played state there. The source's dashboard can stop, pause, seek, and message the viewer
  - When a link's source is down, at its limits, or refuses, another server this one pulls from that maps the same folder and holds the same file plays it instead
  - Each new link is probed for its media info through the link, so runtime and codecs show before anyone plays it. Subtitles and fonts inside the file are read through the link too
  - Make Copy on the Sync tab turns links into full copies. The link keeps playing until its copy is in place
  - Matching works between Film.mkv on one server and Film.strm on another, for history, metadata, people, playlists, and live changes
  changed:
  - A first sync into a library Jellyfin has not scanned since it was empty runs a library scan, since Jellyfin drops a refresh of a folder it does not know yet. A file that arrives as a live change queues one in that case
  fixed:
  - New files in a library that was empty no longer wait for the next scheduled scan to show up
  - A pushed playlist deleted just after an edit no longer comes back. Jellyfin's refresh from the edit could save it back as it finished, so it is now deleted again when that refresh completes
  developer:
  - Schema v32 adds StorageMode to content rows. Once a server holds a link, its database asks for a release that knows links, so an older release sets it aside instead of treating links as missing copies. Without links, releases from 12.2.2.0 on still read it
  - The wire protocol is unchanged. Links are advertised as the Link feature on Capabilities, and Stream/Check accepts a file path so a server can fall back to another source
  - New peer routes serve links: Stream, Stream/Check, Playback, Control, and Links. The anonymous link route answers only this server itself, from loopback, with a per link secret
  - New tests cover link matching, storage, routes, fallback, concurrency, and fuzzing, the empty library scan, and the playlist delete. The Docker pool gains link, fallback, chaos, and full disk scenarios
