changelog:
  important:
  - You will need to reset your plugin database in troubleshooting as the schema has shifted dramatically and many previous values need to be re-pulled for accuracy!
  technical:
  - Long overdue rewrite to better share processes
  - Standardize the Refresh > Compare > Sync pipeline between data types
  - Settings cleanup for unused settings
  - Web cleanup for settings that were removed as they are not needed
  fixes:
  - Change the people endpoint to get the full person details instead of relying on BaseItemDTO
  - Treat all dates in UTC instead of dealing with TZ comparisons
  - Handle process percentages more accurately by stages instead of by guessing
  - Handle race conditions for downloads/recycling where an item could be deleted too soon
  - Reset the retry count when moving to the next item instead of setting overall retries
  - Fix stale modals on syncs
  features:
  - Compare values by hashes instead of raw JSON