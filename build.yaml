changelog:
  fixed:
  - Security. A visitor could pass as the server itself to a link's address by sending a loopback X-Forwarded-For through a trusted reverse proxy that forwards that header unchanged. Such a request is refused. The address still needed the link's secret and a user who had just been allowed to play the link
  - Moving a cached file into the library held the link cache for the whole move, which between two disks is a copy, so playback of every link waited until it finished. The move runs on its own, staged beside the copy, and a move that fails is undone and the copy downloaded instead
  - Moving a cached file skipped the checks a download makes. It is held to the copy's place in the library, the disk's room with Minimum Free Space, and one apply at a time
  - Keep a full local copy counted a cached file whose source had since changed size as moved, and during a running sync the move waited for the next scheduled one. Only a cached file at the source's size is moved, and the sync runs again right after the one already running
  - A stop the source could not apply in full was sent again and applied a second time, with a second activity entry. The source answers a stop as applied once the session has ended
  - A playback report the source refused was sent again. Only a report the source did not answer or failed on is retried, and retries wait outside the queue, so a source that is down no longer holds up reports to the others
  changed:
  - The link cache settings no longer mention Always Keep, which makes copies in the library
  developer:
  - The wire protocol and the database schema are unchanged, so this release works alongside 12.2.11.x one server at a time
  - The link address refuses X-Original-For, X-Original-Host, and X-Original-Proto
  - The Docker pool checks Always Keep copies, the Cached filter, keeping a cached link while the source refuses, cached playback staying off the source, session names, and that the source never shows a transcode
