changelog:
  important:
  - Always Keep makes full copies in the library, synced like any copy, instead of holding files in the link cache. On the next refresh the links of picked shows and films become copies under the New files approval, every episode of a picked show and every version of a picked film. Their copies count toward the library's disk and Minimum Free Space, not Cache Size. A copy stays when its pick is removed
  features:
  - A Cached filter on the Sync tab's Content table lists the links whose file is in the link cache
  - A link that becomes a copy takes its file from the link cache when the cache holds all of it, instead of downloading it again. Turn links into full copies starts a sync at once when any selected link is cached
  changed:
  - The source shows a link session as Direct Play or Direct Stream. The source only sends the file, and any transcode runs on the server holding the link
  - Playback from the link cache is not reported to the source, which sends nothing for it. History sync carries its played state there
  - The link cache no longer keeps files for good. Files an earlier release kept for Always Keep are ordinary cached files, dropped by retention and the size limit
  developer:
  - The wire protocol and the database schema are unchanged, so this release works alongside 12.2.11.x one server at a time
  - GET /Sync/Items takes cached=true, and POST /Sync/PromoteItems answers FromCache and starts Sync Content when it is above 0
  - New tests cover Always Keep, moving a cached file into place, the Cached filter, the reported play method, and cached playback staying off the source
