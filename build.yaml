changelog:
  fixed:
  - A viewer of a link stayed listed on the source's dashboard after their stream ended, until the source restarted, whenever the stop report from the server holding the link did not arrive. The source now ends a link session ten minutes after the last report it had, and stops its playback first so played state and the resume position are kept
  - A stop report that fails is tried again, and a player that quits without naming what it played still ends its session on the source
  developer:
  - The wire protocol and the database schema are unchanged, so this release works alongside 12.2.11.0 and 12.2.11.1 one server at a time
  - New tests cover how a link session ends on the source
