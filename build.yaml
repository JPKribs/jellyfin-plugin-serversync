changelog:
  developer:
  - Added Collection and Playlist syncing. Whitelist one to sync its items or blacklist one to exclude them and membership is rechecked every refresh
  - New Sync Collections task recreates whitelisted collections on this server with the synced copies of their items
  - The source API key is now encrypted on every save and is never sent to the browser
  - Thumbnails load through a new plugin image proxy
  - Refreshes refuse to prune a mapping when the source reports zero items for it
  - Refreshes detect catalogs that change mid scan and skip pruning for that run
  - Removing synced items by editing a blacklist now waits for deletion approval instead of deleting automatically
  - Items scheduled for deletion that reappear on the source are restored instead of deleted and redownloaded
  - Deletion never follows symlinked directories or paths outside library roots
  - Recycling bin and temp folder cleanup refuse to run when their path points at a library
  - Cancelled runs no longer record a clean completion
  - Metadata sync applies shows and seasons before their episodes
  - History sync reuses unchanged comparison baselines instead of comparing every item every run
  - Fixed a bandwidth schedule ending at midnight resetting to 6 AM
  - Fixed Minimum Free Disk Space resetting to 10 when set to 0
  - Source servers behind a reverse proxy subpath can now be configured
