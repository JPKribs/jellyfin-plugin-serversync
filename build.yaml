changelog:
  fixes:
  - Critical fix for people image sync — call UpdateToRepositoryAsync(ImageUpdate) after the SaveImage loop. SaveImage updates the BaseItem's in-memory ImageInfos but the DB write does NOT happen reliably for Person items, so verify's reload-from-DB found zero images and every record that actually needed an image sync failed with "local manifest empty, source non-empty". Metadata sync's image apply has had this call all along; people sync was missing it. This is why only ~19 records were failing — those were the ones that genuinely needed an image sync (everyone else had HasImagesChanges=false and never hit the broken code path).