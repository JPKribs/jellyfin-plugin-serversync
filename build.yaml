changelog:
  fixed:
  - A link whose file was replaced on its source kept playing the old version from the link cache. The cached file is dropped as soon as the source announces the change, even when the size is the same, and a cache download already running for the old file is thrown away
  - A link written again rewrote its .nfo every time. The .nfo is written only when the source's details changed
  developer:
  - LinkCache.Invalidate drops a link's file and refuses a download that started before it, and LinkCache.PathFor takes the size the source reports so a cached file of another size is dropped
