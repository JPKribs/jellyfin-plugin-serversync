changelog:
  developer:
  - Refresh CPU cost reduced - identical blobs skip JSON parsing and date parsing only runs on date-shaped strings
  - New Configuration > Processing section with a Refresh Parallelism setting (default 8, the previous behavior) to control how much CPU Metadata and People refreshes may use
  - Deep Image Verification is now a single setting for all sync modules, under Configuration > Processing (re-enable it there if you had it on for Metadata or People)
