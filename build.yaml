changelog:
  developer:
  - Fixed external subtitle downloads saving the main video file in place of the subtitle
  - Refreshes now abort on connection errors instead of treating partial results as source deletions
  - Connection test no longer reports success for an invalid API key
  - Unreadable sync databases are backed up instead of deleted
  - Metadata and People refreshes reuse unchanged image sizes instead of checking every image over HTTP, with new Deep Image Verification settings to force full checks
  - Person catalog fetch is now paginated
  - Content discovery pages are larger for fewer round trips
  - Added an opt in, read only API integration test suite
  - Removed unused client methods and corrected documentation
