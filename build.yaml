changelog:
  added:
  - Enable Media Segment Provider, under Metadata, copies intros, credits, recaps, previews, and commercials from the same file on the servers this one pulls from. Each metadata scan keeps them in the sync database, and Jellyfin's Media Segment Scan takes them from there without asking any server. For such a file the source's segments are the only ones kept. It is off by default
  developer:
  - POST /Sync/Peer/Segments returns the media segments of up to 200 items, with each file's size, runtime, and the server the segments were first made on. A source on an older release answers 404, and the segments already kept stay
  - The database schema is v38, which adds the SourceMediaSegments table. Older releases can still read it
  - The wire protocol is unchanged, so this release works alongside 12.4.17.1 one server at a time
