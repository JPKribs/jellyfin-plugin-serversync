changelog:
  added:
  - Downloading a link. Jellyfin's Download button on a link saves the file it stands in for under the copy's name, from the link cache or the source. A cached file needs download permission on this server only. Any other needs it on both servers, and the source needs this release too
  fixed:
  - A link's media info showed the size of its .strm, a few bytes. It shows the size of the file the link stands in for
  developer:
  - GET /Sync/Peer/Stream/{itemId} takes download=true, and POST /Sync/Peer/Stream/Check takes Download and answers DownloadAllowed. The protocol version is unchanged, since a source that leaves DownloadAllowed out refuses the download
  - The integration pool checks the Download route on a link, a refusal on either server, and a download from the link cache
  - The integration pool reads Activity entries by their current names and overviews
