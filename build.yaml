changelog:
  important:
  - User Sync does not copy administrator rights. Each server's own administrator grants them. A mapped user who is an administrator on a source and should be one here is made one here by hand
  - A file already in a library at the path a new item would take is only replaced as Changed files allows. It is kept as the synced copy when it is the source's size, waits for approval under Require Approval, and is left alone under Disabled
  - The Download Speed limit is the total across every download running at once, not a limit for each file. A setup that relied on several files each running at the limit downloads more slowly until the limit is raised
  fixed:
  - Security. A source could have a local file it never provided taken as its own, and so deleted when it later dropped the item, by listing an item with no size. A file is only taken as the source's when the sizes match
  - Security. The name of a subtitle came from the source unchecked and could overwrite another file in the folder. A subtitle is only written under a subtitle extension and the video's own name, and is held to 256 MB
  - Security. A download is held to the size the source states, and is refused when the temporary folder or the library has no room for it, so a source cannot fill a disk by sending more than it listed
  - Security. A stored server key in its encrypted form could be tested against, or saved with, an address other than its own, which sent the key there. It is held to the address saved for it
  - Security. Any allowed caller could replace the pairing secret this server presents to another, which cut the two off until they paired again. A secret is only taken while this server is asking for one
  - Security. A paired server could read whole files through the media probe, past every stream, user, and speed limit. A probe is held to 512 MB of each file an hour
  - Security. Requests between servers are held to 4 MB and each field of a change to a set length. A disabled server entry is refused as a sender. A standard user's key lists only the links that user can see. A link's address is cleared from movie recommendations. A link is only granted to a user this server lets see the item. An image copied from another server is held to 64 MB
  - One server can no longer take over a content row that belongs to another server and move its file
  - The five History switches, Played / Unplayed Status, Playback Position, Play Count, Last Played Date, and Favorites, are honored. A part switched off is not written here, not written back to the source, and not taken from another server. Changing them makes the next scan read everything again
  - A metadata or people sync removed the server an item was pinned to with Identify, and the tags that tie a mirrored collection to its source
  - A database that holds links kept its mark for older releases only until the next restart, so a downgrade could open it and download over the links
  - A deletion that failed was retried as a download. It waits for approval with its reason
  - Deleting, replacing, or renaming a file also took the subtitles and artwork of another title in the folder whose name began with the same words, such as Avatar and Avatar The Way of Water
  - A download is copied into the library under a temporary name and renamed when complete, so a crash partway never leaves a partial file under the real name
  - A long download follows the Scheduled Speed hours as they begin and end, instead of keeping the speed it started with
  - A change discarded from the Queue was sent again by its sender about fifteen minutes later. The sender is told it is finished
  - The live change workers paused for no time between failed passes after a full batch, and could fill the log
  - The Sync tab did not show the Pending Download, Pending Replace, Pending Delete, and Deleting cards, and the Users view always showed Never for its last run
  - Clearing the Cache Size (GB) field, or typing a fraction, emptied the link cache on save
  features:
  - Retry Failed and Dismiss Failed on the Queue. They show when a change has failed in either direction, and try every failed change again with its attempts cleared, or discard them all, in one press. A retry is tried at once, even while the server it goes to is paused
  changed:
  - Setting descriptions say what the setting does. Detect Updated Files, Minimum Free Space (GB), Download Retries, Size Tolerance (bytes), Temporary Folder, External URL, the Download Speed rows, and the scheduled task descriptions are corrected
  - The documentation is corrected where it disagreed with the plugin, in Content, History, Users, Metadata, People, Links, Live Changes, Setup, Sync Types, and the API reference
  developer:
  - The wire protocol and the database schema are unchanged, so this release works alongside 12.2.11.0 one server at a time
  - POST /Sync/Peer/Pair answers 409 unless this server has a Link call open to the issuing server, and 400 for a secret that is not 32 to 256 letters, digits, - or _. A request from a disabled entry answers 409. A probe past its allowance answers 429
  - New dashboard routes POST /Sync/Hints/Failed/Retry and DELETE /Sync/Hints/Failed, and GET /Sync/Hints carries InboundFailingCount
  - New tests cover what a source may cause on disk, the pairing rules, the probe allowance, the History switches, and the failed queue rows. The Docker pool gains scenarios for a History switch turned off and for the failed queue rows, and checks the pairing rules
